name: Deploy AI Service

on:
  push:
    branches: [main]
    paths:
      - "ai-service/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ai-service
        run: pip install -r requirements.txt

      # Model KHÔNG được tải ở CI — runtime sẽ tự download từ HF Hub
      # khi khởi động, nhờ HF_MODEL_REPO + HF_MODEL_TOKEN trong env

      # --- Thay phần dưới bằng lệnh deploy thực tế của bạn ---
      # Ví dụ: rsync lên VPS, docker build/push, v.v.
      - name: Deploy (customize this step)
        env:
          AI_SERVICE_KEY: ${{ secrets.AI_SERVICE_KEY }}
          AI_CALLBACK_SECRET: ${{ secrets.AI_CALLBACK_SECRET }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          HF_MODEL_REPO: ${{ secrets.HF_MODEL_REPO }}
          HF_MODEL_TOKEN: ${{ secrets.HF_MODEL_TOKEN }}
          AI_MODEL_PATH: "A/final_convnext_tiny.pth"
          AI_MODEL_VERSION: "convnext_tiny-ensemble-v1"
          AI_DEVICE: "cpu"
        run: |
          echo "Add your deploy command here"
          # e.g. ssh deploy@server "cd /app && git pull && systemctl restart ai-service"
